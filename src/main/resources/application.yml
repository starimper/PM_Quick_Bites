server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: quick-bites-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickbites}
    username: ${DB_USERNAME:quickbites}
    password: ${DB_PASSWORD:quickbites}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  time-zone: ${APP_TIME_ZONE:Asia/Almaty}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:${APP_BOOTSTRAP_ADMIN_EMAIL:}}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:${APP_BOOTSTRAP_ADMIN_PASSWORD:}}
  auth:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:kbtu.kz}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
